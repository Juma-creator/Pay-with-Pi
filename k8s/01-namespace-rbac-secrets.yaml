apiVersion: v1
kind: Namespace
metadata:
  name: paywithpi
  labels:
    compliance: strict
    audit-required: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: compliance-replay
  namespace: paywithpi
  labels:
    app: paywithpi-compliance
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: compliance-replay-role
  namespace: paywithpi
rules:
  - apiGroups: ['']
    resources: ['pods', 'pods/logs']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['']
    resources: ['persistentvolumeclaims']
    verbs: ['get', 'list']
  - apiGroups: ['']
    resources: ['configmaps']
    verbs: ['get', 'list']
  - apiGroups: ['apps']
    resources: ['deployments']
    verbs: ['get', 'list']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: compliance-replay-rolebinding
  namespace: paywithpi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: compliance-replay-role
subjects:
  - kind: ServiceAccount
    name: compliance-replay
    namespace: paywithpi
---
apiVersion: v1
kind: Secret
metadata:
  name: compliance-secrets
  namespace: paywithpi
  annotations:
    rotation-policy: "90days"
    next-rotation: "2026-10-10"
type: Opaque
stringData:
  encryption-key: "your-base64-encrypted-32-byte-key-here"
  webhook-signing-key: "your-webhook-signing-key-here"
  regulator-api-token: "your-regulator-token-here"
---
apiVersion: v1
kind: Secret
metadata:
  name: compliance-tls-certs
  namespace: paywithpi
type: kubernetes.io/tls
stringData:
  client.crt: |
    -----BEGIN CERTIFICATE-----
    # Your client certificate here
    -----END CERTIFICATE-----
  client.key: |
    -----BEGIN PRIVATE KEY-----
    # Your client private key here
    -----END PRIVATE KEY-----
  regulator-ca.crt: |
    -----BEGIN CERTIFICATE-----
    # Regulator's CA certificate here
    -----END CERTIFICATE-----
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: compliance-config
  namespace: paywithpi
data:
  region: "Tanzania"
  cluster: "Africa"
  compliance-mode: "sandbox"
  operator-id: "system"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: compliance-logs-pvc
  namespace: paywithpi
  labels:
    app: paywithpi-compliance
    data-classification: "confidential"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: fast-ssd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paywithpi-compliance-replay
  namespace: paywithpi
  labels:
    app: paywithpi-compliance
    compliance-level: critical
    audit-required: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: paywithpi-compliance
  template:
    metadata:
      labels:
        app: paywithpi-compliance
        compliance-level: critical
        audit-required: "true"
        data-classification: "confidential"
      annotations:
        security.compliance/owner: "compliance-team"
        security.compliance/sla-tier: "critical"
        security.compliance/encryption-required: "true"
spec:
  serviceAccountName: compliance-replay
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: compliance-replay
      image: paywithpi-compliance:latest
      imagePullPolicy: IfNotPresent

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL

      env:
        - name: REGION
          valueFrom:
            configMapKeyRef:
              name: compliance-config
              key: region
        - name: CLUSTER
          valueFrom:
            configMapKeyRef:
              name: compliance-config
              key: cluster
        - name: COMPLIANCE_MODE
          valueFrom:
            configMapKeyRef:
              name: compliance-config
              key: compliance-mode
        - name: OPERATOR_ID
          valueFrom:
            configMapKeyRef:
              name: compliance-config
              key: operator-id
        - name: REGULATOR_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: compliance-secrets
              key: regulator-api-token
        - name: METRICS_PORT
          value: "9090"

      ports:
        - name: metrics
          containerPort: 9090
          protocol: TCP

      volumeMounts:
        - name: compliance-logs
          mountPath: /app/logs/compliance
        - name: certs
          mountPath: /etc/certs
          readOnly: true
        - name: secrets
          mountPath: /etc/secrets
          readOnly: true
        - name: tmp
          mountPath: /tmp

      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"

      livenessProbe:
        httpGet:
          path: /health
          port: metrics
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3

      readinessProbe:
        httpGet:
          path: /health
          port: metrics
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 2

  volumes:
    - name: compliance-logs
      persistentVolumeClaim:
        claimName: compliance-logs-pvc
    - name: certs
      secret:
        secretName: compliance-tls-certs
        defaultMode: 0400
    - name: secrets
      secret:
        secretName: compliance-secrets
        defaultMode: 0400
    - name: tmp
      emptyDir: {}

  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/compliance
                operator: In
                values:
                  - "true"
---
apiVersion: v1
kind: Service
metadata:
  name: paywithpi-compliance-metrics
  namespace: paywithpi
  labels:
    app: paywithpi-compliance
spec:
  type: ClusterIP
  selector:
    app: paywithpi-compliance
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: compliance-replay-pdb
  namespace: paywithpi
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: paywithpi-compliance
  unhealthyPodEvictionPolicy: AlwaysAllow