global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'region', 'component']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'default'
  
  routes:
    # Critical alerts - immediate escalation
    - match:
        severity: critical
        component: compliance
      receiver: 'critical-escalation'
      group_wait: 0s
      group_interval: 5m
      repeat_interval: 15m
      continue: true
    
    # Webhook for regulator (all alerts)
    - match:
        component: compliance
      receiver: 'regulator-webhook'
      group_wait: 30s
      continue: true
    
    # Slack for team
    - match:
        severity: 'warning|critical'
        component: compliance
      receiver: 'slack-notifications'
      continue: true
    
    # Email for compliance team (critical only)
    - match:
        severity: critical
        component: compliance
      receiver: 'email-notifications'

# Inhibition rules prevent alert storms
inhibit_rules:
  # Don't send warning if critical alert active for same issue
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'region', 'component']

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:5001/'

  # Regulator webhook
  - name: 'regulator-webhook'
    webhook_configs:
      - url: 'https://compliance.paywithpi.global/webhook'
        bearer_token_file: /etc/alertmanager/secrets/regulator-token
        send_resolved: true
        http_sd_configs:
          - http_client_dial:
              timeout: 30s
          - http_client_tls_config:
              ca_file: /etc/alertmanager/secrets/regulator-ca.crt
              insecure_skip_verify: false

  # Slack notifications
  - name: 'slack-notifications'
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
        channel: '#paywithpi-compliance'
        send_resolved: true
        title: '{{ .CommonLabels.severity | upper }}: {{ .CommonAnnotations.summary }}'
        text: |
          *Alert*: {{ .CommonAnnotations.summary }}
          *Region*: {{ .CommonLabels.region }}
          *Component*: {{ .CommonLabels.component }}
          *Description*: {{ .CommonAnnotations.description }}
          *Runbook*: {{ .CommonAnnotations.runbook_url }}
        color: '{{ if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}'

  # Email notifications
  - name: 'email-notifications'
    email_configs:
      - to: 'compliance-team@paywithpi.global'
        headers:
          Subject: '[{{ .CommonLabels.severity | upper }}] {{ .CommonLabels.region }} Compliance Alert'
          X-From: 'PayWithPi Compliance Monitoring'
          Reply-To: 'compliance-team@paywithpi.global'

  # Critical escalation
  - name: 'critical-escalation'
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
        channel: '#paywithpi-critical'
        title: '🚨 CRITICAL: {{ .CommonAnnotations.summary }}'
        send_resolved: true
    pagerduty_configs:
      - service_key_file: /etc/alertmanager/secrets/pagerduty-service-key
        description: '{{ .CommonLabels.region }}: {{ .CommonAnnotations.summary }}'